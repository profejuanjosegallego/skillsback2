# Precarga y JSON de prueba para una API Spring Boot

El equipo adjunta sus modelos y controladores. Tú entregas dos descargas separadas, y el equipo las pone en su proyecto:

1. `PrecargaDatos.java`: 400 registros por tabla al arrancar la API.
2. `pruebas-json.zip`: 50 JSON de prueba por tabla y un script que los envía todos.

El equipo solo descarga, ubica los archivos y ejecuta los dos comandos.

Responde en español. Trabaja solo con lo que adjuntaron: no inventes clases, campos ni rutas.

## 1. Lee los archivos

Si faltan los modelos o los controladores, pídelos y espera. No pidas repositorios ni servicios: la precarga no los necesita.

De los modelos toma:

- El paquete base y si usan `jakarta.persistence` o `javax.persistence`.
- Las clases con `@Entity`, sus campos y tipos.
- Las restricciones: `length`, `nullable`, `unique`, `@NotNull`, `@NotBlank`, `@Size`, `@Email`, `@Pattern`, `@Min`, `@Max`.
- Las relaciones y qué clase tiene la llave foránea (`@ManyToOne` o el lado dueño de `@OneToOne`).
- Cómo se genera el id. Si no se genera, la precarga debe asignarlo.
- Los `enum` y los setters. Con Lombok, `@Data` o `@Setter` cuentan como setters.

De los controladores toma la ruta completa de cada POST: `@RequestMapping` de la clase más `@PostMapping`, y la clase que recibe en `@RequestBody`.

Si una relación no tiene setter, la precarga no compila. Agrega los métodos que faltan a una copia de esa clase, sin cambiar nada más, y entrégala como archivo aparte.

Si el campo de relación del hijo tiene `@JsonIgnore`, el POST responde bien pero guarda la relación en null, y el script no puede detectarlo. En la copia de esa clase cambia solo esa anotación por `@JsonProperty(access = JsonProperty.Access.WRITE_ONLY)`, con su import, y entrégala como archivo aparte. Así el POST lee el padre y el GET sigue sin mostrarlo. No toques `@JsonIgnore` en la lista del padre.

## 2. Escribe PrecargaDatos.java

Sigue esta plantilla y adáptala a las clases reales del equipo. Va en `PAQUETE_BASE.config`.

```java
package PAQUETE_BASE.config;

import java.util.ArrayList;
import java.util.List;
import java.util.Random;

import org.springframework.boot.CommandLineRunner;
import org.springframework.stereotype.Component;
import org.springframework.transaction.annotation.Transactional;

import jakarta.persistence.EntityManager;
import jakarta.persistence.PersistenceContext;

import PAQUETE_BASE.models.Empresa;
import PAQUETE_BASE.models.Reto;

// Spring ejecuta esta clase al arrancar la API, después de crear las tablas.
// Crea primero los padres, porque cada hijo necesita a su padre.
@Component
public class PrecargaDatos implements CommandLineRunner {

    private static final int TOTAL = 400;
    private static final String[] SECTORES = { "Tecnología", "Salud", "Educación", "Comercio" };

    // La semilla fija hace que todo el equipo obtenga los mismos datos.
    private final Random azar = new Random(2026);

    @PersistenceContext
    private EntityManager bd;

    @Override
    @Transactional
    public void run(String... args) {
        if (contar(Empresa.class) > 0) {
            System.out.println("Precarga omitida: la base ya tiene datos.");
            return;
        }

        List<Empresa> empresas = crearEmpresas();
        crearRetos(empresas);

        System.out.println("Precarga lista: " + contar(Empresa.class) + " empresas, " + contar(Reto.class) + " retos.");
    }

    private List<Empresa> crearEmpresas() {
        List<Empresa> filas = new ArrayList<>();
        for (int i = 1; i <= TOTAL; i++) {
            Empresa fila = new Empresa();
            fila.setNombre("Empresa " + i);
            fila.setSector(elegir(SECTORES));
            bd.persist(fila);
            filas.add(fila);
        }
        return filas;
    }

    private void crearRetos(List<Empresa> empresas) {
        for (int i = 1; i <= TOTAL; i++) {
            Reto fila = new Reto();
            fila.setNombre("Reto " + i);
            fila.setEmpresa(empresas.get(azar.nextInt(empresas.size())));
            bd.persist(fila);
        }
    }

    private long contar(Class<?> entidad) {
        return bd.createQuery("select count(e) from " + entidad.getSimpleName() + " e", Long.class).getSingleResult();
    }

    private String elegir(String[] opciones) {
        return opciones[azar.nextInt(opciones.length)];
    }
}
```

Reglas:

- Usa `EntityManager` como en la plantilla. Con `javax.persistence` en los modelos, cambia los imports de `jakarta` a `javax`.
- Crea los padres antes que los hijos, y un método `crear` por entidad.
- Llena todos los campos, también los opcionales, y todas las llaves foráneas.
- Usa textos realistas en español, con datos de empresas y personas de Colombia.
- Respeta cada restricción. Recorta los textos al `length` de la columna.
- En los campos únicos incluye el número `i`, sin pasarte del `length`.
- Las fechas deben tener sentido: el fin va después del inicio, y un hijo no empieza antes que su padre.
- En relaciones muchos a muchos, llena la lista desde el lado dueño.
- Si `@Entity` trae un nombre propio, úsalo en la consulta de `contar`.

## 3. Crea los JSON de prueba

Crea un archivo por tabla, por ejemplo `empresas.json`, con un arreglo de 50 objetos.

- Usa los mismos nombres de campo que el modelo y que `@JsonProperty`, si existe.
- No incluyas el id de la tabla cuando se genera solo.
- Los 50 objetos deben ser válidos y cumplir las restricciones.
- En los campos únicos, usa valores que no choquen con la precarga ni entre sí. Por ejemplo, comienza con `PRB-`.
- Escribe las fechas como las lee Jackson: `2026-03-15` para `LocalDate` y `2026-03-15T08:30:00` para `LocalDateTime`.
- Escribe cada padre con el nombre de su archivo entre llaves dobles, sin ids reales: `"empresa": { "id": "{{empresas}}" }`. El script lo reemplaza por un id real de la API.

Crea también `plan.json`, con las tablas de padres a hijos:

```json
{
  "url": "http://localhost:8080",
  "tablas": [
    { "nombre": "empresas", "ruta": "/api/empresas" },
    { "nombre": "retos", "ruta": "/api/retos" }
  ]
}
```

Si un `application.properties` adjunto trae otro `server.port`, usa ese puerto en `url`.

Copia este script sin cambios en `probar.mjs`:

```js
#!/usr/bin/env node
// Envía todos los JSON de prueba a la API. Solo necesita Node 18 o superior.
// Uso, desde la carpeta que contiene pom.xml: node pruebas-json/probar.mjs
import { readFile, writeFile } from 'node:fs/promises';
import { dirname, join } from 'node:path';
import { fileURLToPath } from 'node:url';

const carpeta = dirname(fileURLToPath(import.meta.url));
const leerJson = async (nombre) => JSON.parse(await readFile(join(carpeta, nombre), 'utf8'));
const plan = await leerJson('plan.json');
const url = (process.argv[2] ?? plan.url).replace(/\/$/, '');
const ids = {};
const problemas = [];

async function pedir(metodo, ruta, cuerpo) {
  const r = await fetch(url + ruta, {
    method: metodo,
    headers: cuerpo ? { 'Content-Type': 'application/json' } : undefined,
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const texto = await r.text();
  let datos = texto;
  try { datos = JSON.parse(texto); } catch { /* la respuesta no es JSON */ }
  return { status: r.status, datos };
}

// Toma los ids reales que tiene la API en este momento.
async function leerIds(tabla) {
  const { datos } = await pedir('GET', tabla.ruta);
  const filas = Array.isArray(datos) ? datos : datos?.content ?? [];
  return filas.map((f) => f.id).filter((id) => id !== undefined);
}

// Cambia cada {{tabla}} por un id real de esa tabla.
function completar(valor) {
  if (Array.isArray(valor)) return valor.map(completar);
  if (valor && typeof valor === 'object') return Object.fromEntries(Object.entries(valor).map(([k, v]) => [k, completar(v)]));
  const padre = typeof valor === 'string' ? valor.match(/^\{\{(.+)\}\}$/)?.[1] : null;
  if (!padre) return valor;
  const opciones = ids[padre] ?? [];
  if (!opciones.length) throw new Error(`No hay ids de ${padre}.`);
  return opciones[Math.floor(Math.random() * opciones.length)];
}

const relaciones = (cuerpo) => Object.keys(cuerpo).filter((k) => cuerpo[k]?.id !== undefined);

try {
  await pedir('GET', plan.tablas[0].ruta);
} catch {
  console.error(`No hay respuesta en ${url}. Inicien la API con mvnw spring-boot:run y vuelvan a intentarlo.`);
  process.exit(2);
}

let enviados = 0;
let guardados = 0;
for (const tabla of plan.tablas) {
  ids[tabla.nombre] = await leerIds(tabla);
  if (tabla.soloLeer) continue;
  let bien = 0;
  const objetos = await leerJson(`${tabla.nombre}.json`);
  for (const [i, objeto] of objetos.entries()) {
    enviados++;
    const nombre = `${tabla.nombre} #${i + 1}`;
    try {
      const cuerpo = completar(objeto);
      const r = await pedir('POST', tabla.ruta, cuerpo);
      if (r.status < 200 || r.status >= 300) {
        problemas.push(`${nombre}: respondió ${r.status}. ${JSON.stringify(r.datos).slice(0, 300)}`);
        continue;
      }
      const perdidas = relaciones(cuerpo).filter((k) => r.datos && typeof r.datos === 'object' && k in r.datos && r.datos[k] === null);
      if (perdidas.length) {
        problemas.push(`${nombre}: se guardó sin ${perdidas.join(', ')}.`);
        continue;
      }
      if (r.datos?.id !== undefined) ids[tabla.nombre].push(r.datos.id);
      bien++;
    } catch (error) {
      problemas.push(`${nombre}: ${error.message}`);
    }
  }
  guardados += bien;
  console.log(`${tabla.nombre}: ${bien} de ${objetos.length} guardados`);
}

console.log(`\nTotal: ${guardados} de ${enviados} guardados.`);
if (problemas.length) {
  await writeFile(join(carpeta, 'resultado.txt'), `${problemas.join('\n')}\n`);
  console.log('Peguen pruebas-json/resultado.txt en el chat de Claude.');
  process.exit(1);
}
console.log('La API aceptó todos los JSON. Para repetir la prueba, reinicien la API.');
```

## 4. Empaqueta y comprueba

Comprime en `pruebas-json.zip` estos archivos, sin carpeta interna:

```
probar.mjs
plan.json
empresas.json (y uno por cada tabla)
```

`PrecargaDatos.java` y las clases corregidas no van en el `.zip`: entrégalos sueltos.

Antes de entregar, confirma con un script que:

- Cada archivo de tabla es JSON válido y tiene 50 objetos.
- Cada `{{tabla}}` corresponde a una tabla anterior en `plan.json`.
- `probar.mjs` quedó idéntico al de este skill.

## 5. Entrega

Entrega `PrecargaDatos.java`, `pruebas-json.zip` y las clases corregidas como archivos descargables, y responde solo esto:

1. **Qué hacer**:
   - Descarguen `PrecargaDatos.java` y pónganlo en `src/main/java/RUTA_DEL_PAQUETE/config/`, con la ruta real del proyecto. Si la carpeta `config` no existe, créenla.
   - Si hay clases corregidas, reemplacen las que tienen. Indica la ruta de cada una.
   - Descompriman `pruebas-json.zip` en una carpeta llamada `pruebas-json`, junto a `pom.xml`.
   - Inicien la API con `mvnw spring-boot:run` y, en otra terminal, en la carpeta de `pom.xml`, ejecuten `node pruebas-json/probar.mjs`.
2. **Qué deben ver**: `Precarga lista` en la consola de la API y el total de JSON guardados en la otra terminal.
3. **Avisos**: solo si aplican.
   - Si corregiste una clase, di cuál y qué cambiaste.
   - Si un modelo no tiene POST en los controladores, déjalo fuera de `plan.json` y dilo. Si otra tabla depende de sus ids, añádelo al plan con `"soloLeer": true`.

No pidas al equipo editar el contenido de los archivos, reemplazar ids ni enviar peticiones a mano.

Si algo falla, pide el error o `resultado.txt` y la clase que mencionan. Corrige y vuelve a entregar el archivo completo.

No digas que ejecutaste la API: corre en el computador del equipo y tú no puedes alcanzar su localhost.

const SKILL = document.getElementById('skill-md').textContent.trim() + '\n';
const NOMBRE = 'precargar-api';
const MENSAJE = `Usa el skill ${NOMBRE}. Adjunto mis modelos y controladores. Entrégame PrecargaDatos.java y pruebas-json.zip.`;

// ---------------------------- ZIP sin compresión -------------------------------
const TABLA_CRC = Uint32Array.from({ length: 256 }, (_, n) => {
  let v = n;
  for (let k = 0; k < 8; k++) v = v & 1 ? 0xedb88320 ^ (v >>> 1) : v >>> 1;
  return v >>> 0;
});
function crc32(bytes) {
  let v = 0xffffffff;
  for (const b of bytes) v = TABLA_CRC[(v ^ b) & 0xff] ^ (v >>> 8);
  return (v ^ 0xffffffff) >>> 0;
}
function crearZip(ruta, contenido) {
  const cod = new TextEncoder();
  const u16 = (n) => [n & 255, (n >>> 8) & 255];
  const u32 = (n) => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const ahora = new Date();
  const hora = (ahora.getHours() << 11) | (ahora.getMinutes() << 5) | (ahora.getSeconds() >> 1);
  const fecha = ((ahora.getFullYear() - 1980) << 9) | ((ahora.getMonth() + 1) << 5) | ahora.getDate();
  const nombre = cod.encode(ruta);
  const datos = cod.encode(contenido);
  const comun = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(hora), ...u16(fecha), ...u32(crc32(datos)), ...u32(datos.length), ...u32(datos.length), ...u16(nombre.length), ...u16(0)];
  const local = Uint8Array.from([...u32(0x04034b50), ...comun]);
  const central = Uint8Array.from([...u32(0x02014b50), ...u16(20), ...comun, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(0)]);
  const tamCentral = central.length + nombre.length;
  const posicion = local.length + nombre.length + datos.length;
  const fin = Uint8Array.from([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(1), ...u16(1), ...u32(tamCentral), ...u32(posicion), ...u16(0)]);
  return new Blob([local, nombre, datos, central, nombre, fin], { type: 'application/zip' });
}

// ------------------------------- Diagrama --------------------------------------
function diagrama() {
  const cajas = { Empresa: [20, 16], Categoria: [240, 16], Prioridad: [460, 16], Reto: [240, 136], Registro: [240, 256] };
  const ancho = 160, alto = 48;
  const relaciones = [['Empresa', 'Reto'], ['Categoria', 'Reto'], ['Prioridad', 'Reto'], ['Reto', 'Registro']];
  const lineas = relaciones.map(([padre, hijo]) => {
    const [px, py] = cajas[padre], [hx, hy] = cajas[hijo];
    const x1 = px + ancho / 2, y1 = py + alto, y2 = hy;
    // Cada relación llega a un punto distinto del hijo para que no se encimen.
    const x2 = hx + ancho / 2 + Math.sign(x1 - (hx + ancho / 2)) * 50;
    return `<path class="linea" d="M${x1} ${y1} C${x1} ${y1 + 36}, ${x2} ${y2 - 36}, ${x2} ${y2}"/>
      <text class="card" x="${x1 + (x1 < x2 ? 10 : x1 > x2 ? -10 : 8)}" y="${y1 + 15}" text-anchor="middle">1</text>
      <text class="card" x="${x2 + (x1 < x2 ? -12 : x1 > x2 ? 12 : 8)}" y="${y2 - 6}" text-anchor="middle">N</text>`;
  }).join('');
  const nodos = Object.entries(cajas).map(([nombre, [x, y]]) => `<rect class="caja" x="${x}" y="${y}" width="${ancho}" height="${alto}" rx="4"/>
      <text class="nombre-caja" x="${x + ancho / 2}" y="${y + 29}" text-anchor="middle">${nombre}</text>`).join('');
  return `<figure class="diagrama"><svg viewBox="0 0 640 320" role="img" aria-label="Diagrama de relaciones: Empresa, Categoría y Prioridad tienen muchos Retos; Reto tiene muchos Registros.">${lineas}${nodos}</svg>
    <figcaption>Claude lee estas relaciones en sus modelos. Por eso crea primero los padres y después los hijos.</figcaption></figure>`;
}

// --------------------------------- Pasos ---------------------------------------
const PASOS = [
  {
    titulo: 'Leer e instalar el skill',
    cuerpo: () => `<p class="texto">Un skill es un archivo de instrucciones para Claude. Antes de instalarlo, lean qué le pide hacer.</p>
      <ul class="lista">
        <li>Lee sus modelos y controladores, sin inventar clases ni campos.</li>
        <li>Escribe <code>PrecargaDatos.java</code> con 400 registros por tabla.</li>
        <li>Crea 50 JSON de prueba por tabla y un script que los envía a su API.</li>
        <li>Les entrega los archivos para que los descarguen y los pongan en su proyecto.</li>
      </ul>
      <div class="visor">
        <p class="visor-tit">${NOMBRE}/SKILL.md</p>
        <pre tabindex="0" aria-label="Contenido completo del skill"><code id="ver-skill"></code></pre>
      </div>
      <h3>Cuando lo hayan leído</h3>
      <p class="ayuda">Necesitan JDK 17 o superior y Node 18 o superior.</p>
      <ol class="lista">
        <li><button type="button" class="pri" id="bajar">Descargar ${NOMBRE}.zip</button></li>
        <li>En <a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a>, activen la creación de archivos en Settings &gt; Capabilities.</li>
        <li>Vayan a Customize &gt; Skills, toquen <strong>+</strong> y elijan <strong>Upload a skill</strong>.</li>
        <li>Suban <code>${NOMBRE}.zip</code> sin descomprimirlo.</li>
      </ol>`,
  },
  {
    titulo: 'Llevar su código',
    cuerpo: () => `<ol class="lista">
        <li>Abran un chat nuevo en Claude.</li>
        <li>Adjunten todos los <code>.java</code> de sus carpetas de modelos y controladores.</li>
        <li>Envíen este mensaje:</li>
      </ol>
      <div class="mensaje"><p>${MENSAJE}</p><button type="button" class="sec" id="copiar">Copiar mensaje</button></div>
      ${diagrama()}`,
  },
  {
    titulo: 'Recibir los archivos',
    cuerpo: () => `<div class="entregas">
        <div class="entrega"><strong>PrecargaDatos.java</strong><p>Crea 400 registros por tabla, unidos con sus relaciones, al arrancar la API.</p></div>
        <div class="entrega"><strong>pruebas-json.zip</strong><p>Trae 50 JSON de prueba por tabla y el script que los envía.</p></div>
      </div>
      <ol class="lista">
        <li>Descarguen <code>PrecargaDatos.java</code> y pónganlo en la carpeta <code>config</code> que Claude les indique. Si no existe, créenla.</li>
        <li>Si Claude corrigió alguna clase, descárguenla y reemplacen la que tienen.</li>
        <li>Descarguen <code>pruebas-json.zip</code> y descomprímanlo en una carpeta llamada <code>pruebas-json</code>, junto a <code>pom.xml</code>.</li>
        <li>Inicien la API con <code>mvnw spring-boot:run</code>. En la consola debe aparecer <code>Precarga lista</code>.</li>
        <li>En otra terminal, en la carpeta que contiene <code>pom.xml</code>, ejecuten <code>node pruebas-json/probar.mjs</code>. El script toma ids reales de su API y envía todos los JSON.</li>
      </ol>
      <p class="ayuda">Al final verán cuántos JSON se guardaron. Si algo falla, peguen el error o <code>pruebas-json/resultado.txt</code> en el mismo chat de Claude.</p>`,
  },
];
let actual = 0;
const encabezado = (i) => `<header class="enc-paso"><p class="contador">Paso ${i + 1} de ${PASOS.length}</p><h2>${PASOS[i].titulo}</h2></header>`;

function dibujar() {
  document.getElementById('pasos').innerHTML = PASOS.map((p, i) => `<li><button type="button" data-ir="${i}" ${i === actual ? 'aria-current="step"' : ''}><span class="num">${i + 1}</span>${p.titulo}</button></li>`).join('');
  document.getElementById('paso').innerHTML = `${encabezado(actual)}${PASOS[actual].cuerpo()}
    <nav class="nav-paso" aria-label="Moverse entre pasos">
      ${actual > 0 ? `<button type="button" class="sec" data-ir="${actual - 1}">Anterior</button>` : ''}
      ${actual < PASOS.length - 1 ? `<button type="button" class="pri solo-derecha" data-ir="${actual + 1}">Siguiente: ${PASOS[actual + 1].titulo}</button>` : ''}
    </nav>`;
  const visor = document.getElementById('ver-skill');
  if (visor) visor.textContent = SKILL;
}

async function copiar(boton) {
  const original = boton.textContent;
  try {
    await navigator.clipboard.writeText(MENSAJE);
    boton.textContent = 'Copiado';
  } catch {
    boton.textContent = 'No se pudo copiar';
  }
  setTimeout(() => { boton.textContent = original; }, 1600);
}

function descargar() {
  const url = URL.createObjectURL(crearZip(`${NOMBRE}/SKILL.md`, SKILL));
  const a = Object.assign(document.createElement('a'), { href: url, download: `${NOMBRE}.zip` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ir !== undefined) {
    actual = Number(b.dataset.ir);
    dibujar();
    document.getElementById('paso').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  } else if (b.id === 'bajar') descargar();
  else if (b.id === 'copiar') copiar(b);
});

dibujar();
</script>
</body>
</html>
